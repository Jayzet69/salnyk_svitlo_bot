name: svitlo
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency: svitlo
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python bot.py
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          VOE_ADDRESS: ${{ secrets.VOE_ADDRESS }}
      - name: save state
        run: |
          git config user.name svitlo-bot
          git config user.email svitlo-bot@users.noreply.github.com
          git add state.json
          git diff --cached --quiet || (git commit -m "state" && git push)
